[package]
name = "egui-hikvision"
version = "0.1.0"
edition = "2021"
description = "Hikvision HCNetSDK demo with egui"
license = "MIT"

[[bin]]
name = "egui-hikvision"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true