[package]
name = "hcnetsdk-rust-demo"
version = "0.1.0"
edition = "2021"
description = "Hikvision HCNetSDK Qt-style demo reimplemented in Rust with Slint"
license = "MIT"
authors = ["Rust port of HCNetSDK Qt Demo"]

[[bin]]
name = "hcnetsdk-rust-demo"
path = "src/main.rs"

[dependencies]
slint = "1.16"
libloading = "0.8"
libc = "0.2"
log = "0.4"
env_logger = "0.11"
once_cell = "1.20"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
x11rb = "0.13"

[build-dependencies]
slint-build = "1.16"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
